<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <defs>
    <linearGradient id="goldCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge (Optional, subtle dark stadium glass) -->
  <rect x="6" y="6" width="468" height="108" rx="20" fill="#070B14" fill-opacity="0.9" stroke="url(#goldCyanGrad)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Icon dot / stadium flash -->
  <circle cx="52" cy="60" r="14" fill="#06B6D4" />
  <circle cx="52" cy="60" r="7" fill="#F59E0B" />
  
  <!-- Text: ĐIỂM ĐỌC -->
  <text x="88" y="74" font-family="'Montserrat', 'Oswald', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" fill="#FFFFFF">
    ĐIỂM <tspan fill="url(#goldCyanGrad)">ĐỌC</tspan>
  </text>
  
  <!-- Tagline badge -->
  <text x="90" y="98" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#06B6D4" fill-opacity="0.85">
    THỂ THAO 24/7
  </text>
</svg>
