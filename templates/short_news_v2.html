<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>Điểm Đọc — Tin Thể Thao v2 (9:16 Shorts News v2)</title>

<style>
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('__ASSETS__/fonts/Barlow_Condensed/BarlowCondensed-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('__ASSETS__/fonts/Barlow_Condensed/BarlowCondensed-ExtraBold.ttf') format('truetype');
    font-weight: 800;
    font-display: block;
  }
  @font-face {
    font-family: 'Be Vietnam Pro';
    src: url('__ASSETS__/fonts/Be_Vietnam_Pro/BeVietnamPro-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: 'Be Vietnam Pro';
    src: url('__ASSETS__/fonts/Be_Vietnam_Pro/BeVietnamPro-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }

  :root {
    --vw: 1080px;
    --vh: 1920px;

    /* Màu Cyber-Stadium Điểm Đọc */
    --bg-dark: #060911;
    --accent-gold: #00E5FF;
    --accent-cyan: #06B6D4;
    --accent-red: #EF4444;
    --ink-white: #FFFFFF;
    --ink-subtle: #94A3B8;

    --font-heading: 'Barlow Condensed', sans-serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: var(--vw);
    height: var(--vh);
    background-color: var(--bg-dark);
    color: var(--ink-white);
    font-family: var(--font-body);
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  #stage-viewport {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #0d1527 0%, #060911 85%);
  }

  /* ── 1. SÂN KHẤU NỘI DUNG ẢNH GẦN FULL CHIỀU CAO (CAO 1430PX, Z-INDEX 25) ── */
  #scenes-root {
    position: absolute;
    top: 245px;
    bottom: 245px;
    left: 0;
    right: 0;
    width: 1080px;
    height: 1430px;
    overflow: hidden;
    z-index: 25;
    background: #060911;
  }

  .sentence-stage {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    visibility: hidden;
    overflow: hidden;
  }

  .pan-photo-wrapper {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: #060911;
  }

  /* Gradient viền trên và dưới hòa quyện mượt mà vào header và phụ đề */
  .pan-photo-wrapper::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 130px;
    background: linear-gradient(180deg, rgba(6, 9, 17, 1) 0%, rgba(6, 9, 17, 0.45) 60%, transparent 100%);
    z-index: 5;
    pointer-events: none;
  }

  .pan-photo-wrapper::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 150px;
    background: linear-gradient(0deg, rgba(6, 9, 17, 1) 0%, rgba(6, 9, 17, 0.55) 60%, transparent 100%);
    z-index: 5;
    pointer-events: none;
  }

  .pan-img {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: auto;
    min-width: 1080px;
    display: block;
    transform-origin: 50% 15%;
    will-change: transform, opacity;
  }

  .pan-img.portrait-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 18%;
    transform-origin: 50% 18%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  /* ── 2. LỚP HIỆU ỨNG OVERLAY (Z-INDEX 45) NẰM TRÊN ẢNH, DƯỚI TEXT ── */
  #fx-canvas {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 45;
    pointer-events: none;
  }

  .vignette-top {
    position: absolute;
    top: 0; left: 0; right: 0; height: 280px;
    background: linear-gradient(180deg, rgba(6, 9, 17, 0.98) 0%, rgba(6, 9, 17, 0.70) 65%, transparent 100%);
    z-index: 50;
    pointer-events: none;
  }

  .vignette-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0; height: 320px;
    background: linear-gradient(0deg, rgba(6, 9, 17, 0.98) 0%, rgba(6, 9, 17, 0.85) 65%, transparent 100%);
    z-index: 50;
    pointer-events: none;
  }

  /* ── 3. HEADER THƯƠNG HIỆU & CHIP NGÀY (Z-INDEX 100) ── */
  #header-bar {
    position: absolute;
    top: 44px; left: 40px; right: 40px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .channel-capsule {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(11, 16, 29, 0.90);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 999px;
    padding: 6px 16px 6px 8px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }

  .channel-logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--accent-gold);
  }

  .channel-name {
    font-family: var(--font-heading);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--ink-white);
  }

  .category-pill {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-cyan);
    background: rgba(6, 182, 212, 0.12);
    border: 1px solid rgba(6, 182, 212, 0.35);
    padding: 6px 14px;
    border-radius: 8px;
  }

  .date-chip {
    font-family: var(--font-heading);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--accent-gold);
    background: rgba(11, 16, 29, 0.90);
    border: 1px solid rgba(0, 229, 255, 0.45);
    padding: 6px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }

  /* THANH TIÊU ĐỀ CỐ ĐỊNH 9:16 (NẰM Ở KHOẢNG TRỐNG PHÍA TRÊN ẢNH) */
  #fixed-headline-container {
    position: absolute;
    top: 135px; left: 40px; right: 40px;
    z-index: 95;
    display: none;
    pointer-events: none;
  }

  #fixed-headline-bar {
    width: 100%;
    font-family: var(--font-heading);
    font-size: 42px;
    font-weight: 800;
    line-height: 1.15;
    color: var(--ink-white);
    background: rgba(11, 16, 29, 0.94);
    border-left: 6px solid var(--accent-gold);
    border-radius: 0 12px 12px 0;
    padding: 10px 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.7);
    overflow: hidden;
  }

  /* ── 4. KHỐI TIÊU ĐỀ LỚN (HERO TITLE ĐẦU VIDEO) ── */
  #hero-title-container {
    position: absolute;
    top: 145px; left: 40px; right: 40px;
    z-index: 90;
    pointer-events: none;
  }

  .hero-title-box {
    background: linear-gradient(180deg, rgba(6, 9, 17, 0.96) 0%, rgba(11, 16, 29, 0.92) 100%);
    border-left: 6px solid var(--accent-gold);
    border-radius: 0 14px 14px 0;
    padding: 20px 26px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.8);
  }

  .hero-title-text {
    font-family: var(--font-heading);
    font-size: 50px;
    font-weight: 800;
    line-height: 1.18;
    color: var(--ink-white);
    letter-spacing: 0.5px;
  }

  .title-word {
    display: inline-block;
    margin-right: 10px;
  }

  .title-word.kw-gold {
    color: var(--accent-gold);
    text-shadow: 0 0 20px rgba(0, 229, 255, 0.85);
  }

  /* ── 5. LOWER-THIRD: NGUỒN TIN (TRÁI) & NGUỒN ẢNH (PHẢI) (Z-INDEX 90) ── */
  #lower-third-bar {
    position: absolute;
    bottom: 215px; left: 40px; right: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 90;
    pointer-events: none;
  }

  .lt-source {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-subtle);
    background: rgba(6, 9, 17, 0.88);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 6px;
    padding: 5px 14px;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
  }

  .lower-third-left .lt-source {
    color: #38BDF8;
    border-color: rgba(56, 189, 248, 0.4);
  }

  .lower-third-right .lt-source {
    color: #F1F5F9;
    border-color: rgba(0, 229, 255, 0.4);
  }

  /* ── 6. HỘP PHỤ ĐỀ KARAOKE CỠ LỚN ~48PX (NẰM DƯỚI ĐÁY KHUNG, Z-INDEX 100) ── */
  #karaoke-container {
    position: absolute;
    bottom: 45px; left: 36px; right: 36px;
    min-height: 135px;
    max-height: 190px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    pointer-events: none;
  }

  #karaoke-box {
    width: 100%;
    min-height: 130px;
    background: rgba(6, 9, 17, 0.95);
    border: 2px solid rgba(0, 229, 255, 0.45);
    border-radius: 18px;
    padding: 16px 26px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 14px;
    backdrop-filter: blur(16px);
    box-shadow: 0 16px 48px rgba(0,0,0,0.95), 0 0 20px rgba(0, 229, 255, 0.2);
  }

  .k-word {
    font-family: var(--font-body);
    font-size: 48px;
    font-weight: 700;
    color: #94A3B8;
    line-height: 1.25;
    display: inline-block;
  }

  .k-word.spoken {
    color: #FFFFFF;
    font-weight: 700;
  }

  .k-word.active {
    color: #060911 !important;
    background: var(--accent-gold);
    font-weight: 800;
    border-radius: 8px;
    padding: 3px 12px;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.95);
    transform: scale(1.06);
  }

  .k-word.is-keyword {
    border-bottom: 2.5px solid var(--accent-cyan);
  }

  /* ── 7. SÂN KHẤU ĐỒ THỊ DỮ LIỆU ĐỘNG CYBER-STADIUM (05.11.2026 STYLE + DATAVIZ) ── */
  .pan-photo-wrapper.has-chart-backdrop {
    opacity: 0.14;
    filter: saturate(0.55) contrast(1.05);
  }

  .dd-chart-stage {
    position: absolute;
    top: 34px;
    bottom: 44px;
    left: 34px;
    right: 34px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    pointer-events: none;
  }

  .dd-chart-card {
    --viz-surface: #0E1522;
    --viz-elev: #131D30;
    --viz-line: #22304A;
    --viz-ink: #EAEFF7;
    --viz-sec: #CBD5E1;
    --viz-mute: #8E9AB1;
    --series-1: #0095D6;
    --series-2: #C98500;
    --series-3: #D55181;

    width: 100%;
    height: 100%;
    background: rgba(14, 21, 34, 0.94);
    border: 1.5px solid rgba(0, 229, 255, 0.28);
    border-radius: 20px;
    padding: 28px 34px 24px 34px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.82), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(14px);
    opacity: 0;
  }

  .dd-chart-head {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--viz-line);
    padding-bottom: 18px;
  }

  .dd-chart-kicker {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-heading);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--viz-sec);
    text-transform: uppercase;
  }

  .dd-kicker-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-gold);
    box-shadow: 0 0 10px rgba(0, 229, 255, 0.9);
  }

  .dd-chart-title {
    font-family: var(--font-heading);
    font-size: 42px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: 0.4px;
    color: var(--viz-ink);
    text-transform: uppercase;
  }

  .dd-chart-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    align-items: center;
    margin-top: 2px;
  }

  .dd-leg-item {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 700;
    color: var(--viz-sec);
  }

  .dd-leg-swatch {
    width: 22px;
    height: 11px;
    border-radius: 3px;
    display: inline-block;
  }

  .dd-chart-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    gap: 18px;
    padding: 14px 0;
  }

  .dd-section {
    background: var(--viz-elev);
    border: 1px solid var(--viz-line);
    border-radius: 14px;
    padding: 16px 22px 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dd-sec-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .dd-sec-label {
    font-family: var(--font-heading);
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 1.2px;
    color: var(--viz-ink);
    text-transform: uppercase;
  }

  .dd-sec-sub {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--viz-mute);
  }

  .dd-axis-row {
    display: flex;
    align-items: center;
    height: 22px;
    margin-bottom: 2px;
  }

  .dd-axis-spacer {
    width: 278px;
    flex-shrink: 0;
  }

  .dd-axis-ticks {
    flex: 1;
    position: relative;
    height: 20px;
  }

  .dd-tick-lbl {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--viz-mute);
    font-variant-numeric: tabular-nums;
  }

  .dd-rows-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .dd-grid-layer {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 278px;
    right: 0;
    pointer-events: none;
  }

  .dd-grid-line {
    position: absolute;
    top: -4px;
    bottom: -4px;
    width: 1px;
    background: var(--viz-line);
  }

  .dd-row {
    display: flex;
    align-items: center;
    min-height: 58px;
    position: relative;
    z-index: 2;
  }

  .dd-id-col {
    width: 278px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 11px;
    padding-right: 16px;
  }

  .dd-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: #060911;
    border: 2.5px solid var(--viz-line);
  }

  .dd-flag-svg {
    width: 26px;
    height: 18px;
    border-radius: 3px;
    flex-shrink: 0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
  }

  .dd-name-stack {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .dd-player-name {
    font-family: var(--font-heading);
    font-size: 25px;
    font-weight: 700;
    color: var(--viz-ink);
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dd-player-sub {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    color: var(--viz-mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dd-plot-col {
    flex: 1;
    display: flex;
    align-items: center;
    height: 46px;
    position: relative;
  }

  .dd-bar {
    height: 24px;
    border-radius: 0 4px 4px 0;
    width: 0%;
    position: relative;
    flex-shrink: 0;
  }

  .dd-bar.is-leader-glow {
    box-shadow: 0 0 0 2px #FFFFFF, 0 0 16px rgba(0, 229, 255, 0.75);
  }

  .dd-stack-wrap {
    display: flex;
    align-items: center;
    height: 24px;
    width: 0%;
    overflow: hidden;
    flex-shrink: 0;
  }

  .dd-stack-seg {
    height: 100%;
    border-right: 2px solid var(--viz-surface);
  }
  .dd-stack-seg:last-child {
    border-right: none;
    border-radius: 0 4px 4px 0;
  }

  .dd-tip {
    margin-left: 12px;
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .dd-val-num {
    font-family: var(--font-heading);
    font-size: 34px;
    font-weight: 800;
    color: var(--viz-ink);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .dd-val-delta {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    color: var(--viz-sec);
    background: rgba(0, 149, 214, 0.18);
    border: 1px solid rgba(0, 229, 255, 0.45);
    padding: 2px 8px;
    border-radius: 5px;
  }

  .dd-val-sub {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 600;
    color: var(--viz-mute);
    font-variant-numeric: tabular-nums;
  }

  .dd-dual-avatars {
    position: relative;
    width: 82px;
    height: 48px;
    flex-shrink: 0;
  }
  .dd-dual-avatars .dd-avatar {
    position: absolute;
    top: 0;
  }
  .dd-dual-avatars .dd-avatar:first-child { left: 0; z-index: 2; }
  .dd-dual-avatars .dd-avatar:last-child { left: 32px; z-index: 1; }

  /* Hero duel header for Type 2 (duel_stack) */
  .dd-hero-duel {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    background: var(--viz-elev);
    border: 1px solid var(--viz-line);
    border-radius: 14px;
    padding: 16px 24px;
  }

  .dd-hero-side {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dd-hero-side.right {
    justify-content: flex-end;
    text-align: right;
  }

  .dd-hero-big {
    font-family: var(--font-heading);
    font-size: 56px;
    font-weight: 800;
    color: var(--viz-ink);
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
  }

  .dd-hero-lbl {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    color: var(--viz-mute);
    margin-top: 4px;
  }

  .dd-vs-pill {
    font-family: var(--font-heading);
    font-size: 24px;
    font-weight: 800;
    color: var(--viz-ink);
    background: rgba(0, 149, 214, 0.22);
    border: 1.5px solid rgba(0, 229, 255, 0.65);
    padding: 8px 16px;
    border-radius: 999px;
    letter-spacing: 0.8px;
  }

  /* Trophy grid for Type 3 (trophy_race) */
  .dd-trophy-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .dd-trophy-tile {
    background: rgba(14, 21, 34, 0.88);
    border: 1px solid var(--viz-line);
    border-radius: 12px;
    padding: 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0;
  }

  .dd-trophy-tile.is-major {
    border-color: rgba(0, 229, 255, 0.55);
    background: rgba(0, 149, 214, 0.14);
  }

  .dd-trophy-cnt {
    font-family: var(--font-heading);
    font-size: 32px;
    font-weight: 800;
    color: var(--viz-ink);
    line-height: 1;
  }

  .dd-trophy-name {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    color: var(--viz-sec);
    line-height: 1.25;
  }

  .dd-trophy-year {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    color: var(--viz-mute);
  }

  .dd-race-banner {
    display: flex;
    align-items: stretch;

  function renderHeroTitleHTML(txt, customKws) {
    const rawWords = (txt || "").trim().split(/\s+/).filter(Boolean);
    const normWord = (w) => w.toLowerCase().replace(/^[.,!?;:"'()\[\]“”‘’]+|[.,!?;:"'()\[\]“”‘’]+$/g, "");
    const normWords = rawWords.map(normWord);
    const hlFlags = new Array(rawWords.length).fill(false);

    const kws = (customKws && customKws.length) ? customKws.slice() : kwList.slice();
    const builtInPatterns = [
      /\b(?:Công\s+an\s+[A-ZĐ][\p{L}]+(?:\s+[A-ZĐ][\p{L}]+)*|Công\s+an\s+Nhân\s+dân|Tòa\s+án\s+Thể\s+thao|Đại\s+hội\s+Thể\s+thao(?:\s+toàn\s+quốc)?|Ngoại\s+hạng\s+Anh|Quả\s+bóng\s+vàng|Chiếc\s+giày\s+vàng)\b/gu,

      /\b\d+-\d+\b/gu,
      /\b\d+(?:[.,]\d+)?\s*(?:HCV|HCB|HCĐ|%|điểm|bàn)\b/giu
    ];
    builtInPatterns.forEach(rx => {
      let m;
      while ((m = rx.exec(txt || "")) !== null) {
        kws.push(m[0]);
      }
    });

    const uniquePhrases = Array.from(new Set(kws.map(p => (p || "").trim()).filter(Boolean)));
    uniquePhrases.sort((a, b) => b.split(/\s+/).length - a.split(/\s+/).length || b.length - a.length);

    uniquePhrases.forEach(phrase => {
      const pTokens = phrase.split(/\s+/).map(normWord).filter(Boolean);
      if (!pTokens.length) return;
      if (pTokens.length === 1 && pTokens[0].length < 2 && !/^\d+$/.test(pTokens[0])) return;
      for (let i = 0; i <= normWords.length - pTokens.length; i++) {
        let matched = true;
        for (let j = 0; j < pTokens.length; j++) {
          if (normWords[i + j] !== pTokens[j]) {
            matched = false;
            break;
          }
        }
        if (matched) {
          for (let j = 0; j < pTokens.length; j++) {
            hlFlags[i + j] = true;
          }
        }
      }
    });

    return rawWords.map((w, idx) => {
      return `<span class="title-word ${hlFlags[idx] ? 'kw-gold' : ''}">${w}</span>`;

    if (c === "QA") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#8D1B3D"/><polygon points="0,0 7,0 9.2,2 7,4 9.2,6 7,8 9.2,10 7,12 9.2,14 7,16 9.2,18 0,18" fill="#FFF"/></svg>`;
    }
    if (c === "GR") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#0D5EAF"/><rect y="2" width="26" height="2" fill="#FFF"/><rect y="6" width="26" height="2" fill="#FFF"/><rect y="10" width="26" height="2" fill="#FFF"/><rect y="14" width="26" height="2" fill="#FFF"/><rect width="10" height="10" fill="#0D5EAF"/><rect x="4" width="2" height="10" fill="#FFF"/><rect y="4" width="10" height="2" fill="#FFF"/></svg>`;
    }
    if (c === "CN") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#DE2910"/><polygon points="5,2.2 5.6,4.1 7.6,4.1 6,5.2 6.6,7.1 5,5.9 3.4,7.1 4,5.2 2.4,4.1 4.4,4.1" fill="#FFDE00"/><circle cx="9.2" cy="2.4" r="0.7" fill="#FFDE00"/><circle cx="10.4" cy="4.2" r="0.7" fill="#FFDE00"/><circle cx="10.4" cy="6.4" r="0.7" fill="#FFDE00"/><circle cx="9.2" cy="8.1" r="0.7" fill="#FFDE00"/></svg>`;
    }
    if (c === "HK") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#DE2910"/><circle cx="13" cy="9" r="3.6" fill="none" stroke="#FFF" stroke-width="1.6" stroke-dasharray="2.6 1.8"/><circle cx="13" cy="9" r="1.1" fill="#FFF"/></svg>`;
    }
    if (c === "MY") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#FFF"/><rect y="0" width="26" height="2" fill="#CC0001"/><rect y="4" width="26" height="2" fill="#CC0001"/><rect y="8" width="26" height="2" fill="#CC0001"/><rect y="12" width="26" height="2" fill="#CC0001"/><rect y="16" width="26" height="2" fill="#CC0001"/><rect width="12" height="10" fill="#010066"/><circle cx="5.2" cy="5" r="2.7" fill="#FFCC00"/><circle cx="6.2" cy="5" r="2.2" fill="#010066"/><circle cx="8.5" cy="5" r="1.3" fill="#FFCC00"/></svg>`;
    }
    if (c === "UY") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#FFF"/><rect y="2" width="26" height="2" fill="#0038A8"/><rect y="6" width="26" height="2" fill="#0038A8"/><rect y="10" width="26" height="2" fill="#0038A8"/><rect y="14" width="26" height="2" fill="#0038A8"/><rect width="10" height="10" fill="#FFF"/><circle cx="5" cy="5" r="2.6" fill="#FCD116"/></svg>`;
    }
    if (c === "ML") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="9" height="18" fill="#14B53A"/><rect x="9" width="8" height="18" fill="#FCD116"/><rect x="17" width="9" height="18" fill="#CE1126"/></svg>`;
    }
    if (c === "BE") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="8.67" height="18" fill="#111111"/><rect x="8.67" width="8.67" height="18" fill="#FAE042"/><rect x="17.34" width="8.66" height="18" fill="#ED2939"/></svg>`;
    }
    if (c === "IT") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="8.67" height="18" fill="#009246"/><rect x="8.67" width="8.67" height="18" fill="#FFFFFF"/><rect x="17.34" width="8.66" height="18" fill="#CE2B37"/></svg>`;
    }
    if (c === "ENG") {
      return `<svg class="dd-flag-svg" viewBox="0 0 26 18"><rect width="26" height="18" fill="#FFFFFF"/><rect x="11" width="4" height="18" fill="#CE1124"/><rect y="7" width="26" height="4" fill="#CE1124"/></svg>`;
    }
    return c ? `<span style="font-size:12px;font-weight:800;color:#8E9AB1;width:26px;text-align:center;">${c}</span>` : "";
  }

  function renderIdentityHtml(r) {
    if (r.avatars && r.avatars.length > 1) {
      const avs = r.avatars.slice(0, 2).map((a, idx) =>
        `<img class="dd-avatar" style="border-color:${a.color || '#22304A'}" src="${a.src || ''}">`
      ).join("");
      return `
        <div class="dd-id-col">
          <div class="dd-dual-avatars">${avs}</div>
          <div class="dd-name-stack">
            <div class="dd-player-name">${r.name || ''}</div>
            ${r.sub ? `<div class="dd-player-sub">${r.sub}</div>` : ''}
          </div>
        </div>
      `;
    }
    return `
      <div class="dd-id-col">
        ${r.avatar ? `<img class="dd-avatar" style="border-color:${r.color || '#22304A'}" src="${r.avatar}">` : ''}
        ${renderFlagSvg(r.flag)}
        <div class="dd-name-stack">
          <div class="dd-player-name">${r.name || ''}</div>
          ${r.sub ? `<div class="dd-player-sub">${r.sub}</div>` : ''}
        </div>
      </div>
    `;
  }

  function renderChartSectionHtml(sec, sIdx, secIdx, fillMaxPct) {
    const rows = sec.rows || [];
    const maxAxis = sec.max_axis || Math.max(...rows.map(r => r.value || 1), 1);
    const ticks = sec.ticks || [0, Math.round(maxAxis * 0.5), maxAxis];

    const ticksHtml = ticks.map(v => {
      const pos = ((v / maxAxis) * fillMaxPct).toFixed(2);
      return `<span class="dd-tick-lbl" style="left:${pos}%">${v}</span>`;
    }).join("");

    const gridsHtml = ticks.map(v => {
      const pos = ((v / maxAxis) * fillMaxPct).toFixed(2);
      return `<div class="dd-grid-line" style="left:${pos}%"></div>`;
    }).join("");

    const rowsHtml = rows.map((r, rIdx) => {
      const targetPct = Math.min(fillMaxPct, ((r.value || 0) / maxAxis) * fillMaxPct).toFixed(2);
      let barMarkup = "";
      if (r.segments && r.segments.length) {
        const segTotal = r.segments.reduce((acc, sg) => acc + (sg.value || 0), 0) || r.value || 1;
        const segsHtml = r.segments.map(sg => {
          const sp = (((sg.value || 0) / segTotal) * 100).toFixed(2);
          return `<div class="dd-stack-seg" style="width:${sp}%; background:${sg.color || '#0095D6'}"></div>`;
        }).join("");
        barMarkup = `<div class="dd-stack-wrap" id="dd-bar-${sIdx}-${secIdx}-${rIdx}" data-target-pct="${targetPct}">${segsHtml}</div>`;
      } else {
        barMarkup = `<div class="dd-bar ${r.leader ? 'is-leader-glow' : ''}" id="dd-bar-${sIdx}-${secIdx}-${rIdx}" data-target-pct="${targetPct}" style="background:${r.color || '#0095D6'}"></div>`;
      }
      return `
        <div class="dd-row">
          ${renderIdentityHtml(r)}
          <div class="dd-plot-col">
            ${barMarkup}
            <div class="dd-tip">
              <span class="dd-val-num" id="dd-val-${sIdx}-${secIdx}-${rIdx}" data-target-val="${r.value || 0}" data-unit="${sec.unit || ''}">0</span>
              ${r.breakdown ? `<span class="dd-val-sub">(${r.breakdown})</span>` : ''}
              ${r.delta ? `<span class="dd-val-delta">${r.delta}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join("");

    return `
      <div class="dd-section">
        <div class="dd-sec-top">
          <div class="dd-sec-label">${sec.label || ''}</div>
          ${sec.sub ? `<div class="dd-sec-sub">${sec.sub}</div>` : ''}
        </div>
        <div class="dd-axis-row">
          <div class="dd-axis-spacer"></div>
          <div class="dd-axis-ticks">${ticksHtml}</div>
        </div>
        <div class="dd-rows-wrap">
          <div class="dd-grid-layer">${gridsHtml}</div>
          ${rowsHtml}
        </div>
      </div>
    `;
  }

  function renderChartStageHtml(chart, sIdx) {
    if (!chart) return "";
    const fillMax = chart.type === "duel_stack" ? 68 : 76;

    const legHtml = (chart.legend || []).map(l => `
      <div class="dd-leg-item">
        <span class="dd-leg-swatch" style="background:${l.color}"></span>
        <span>${l.label}</span>
      </div>
    `).join("");

    let bodyParts = [];

    if (chart.type === "duel_stack" && chart.hero) {
      const h = chart.hero;
      const rAvs = (h.right_avatars || []).slice(0, 2).map(a =>
        `<img class="dd-avatar" style="border-color:${a.color || '#22304A'}" src="${a.src || ''}">`
      ).join("");
      bodyParts.push(`
        <div class="dd-hero-duel">
          <div class="dd-hero-side">
            ${h.left_avatar ? `<img class="dd-avatar" style="width:54px;height:54px;border-color:${h.left_color || '#0095D6'}" src="${h.left_avatar}">` : ''}
            <div>
              <div class="dd-hero-big" id="dd-hero-l-${sIdx}" data-target-val="${h.left_val || 0}">0</div>
              <div class="dd-hero-lbl">${h.left_label || ''}</div>
            </div>
          </div>
          <div class="dd-vs-pill">${h.center_badge || 'VS'}</div>
          <div class="dd-hero-side right">
            <div>
              <div class="dd-hero-big" id="dd-hero-r-${sIdx}" data-target-val="${h.right_val || 0}">0</div>
              <div class="dd-hero-lbl">${h.right_label || ''}</div>
            </div>
            <div class="dd-dual-avatars">${rAvs}</div>
          </div>
        </div>
      `);
    }

    (chart.sections || []).forEach((sec, secIdx) => {
      bodyParts.push(renderChartSectionHtml(sec, sIdx, secIdx, fillMax));
    });

    if (chart.trophies && chart.trophies.length) {
      const tilesHtml = chart.trophies.map((t, tIdx) => `
        <div class="dd-trophy-tile ${t.major ? 'is-major' : ''}" id="dd-trophy-${sIdx}-${tIdx}">
          <div class="dd-trophy-cnt">${t.count}</div>
          <div class="dd-trophy-name">${t.name}</div>
          ${t.sub ? `<div class="dd-trophy-year">${t.sub}</div>` : ''}
        </div>
      `).join("");
      bodyParts.push(`
        <div class="dd-section">
          <div class="dd-sec-top">
            <div class="dd-sec-label">${chart.trophy_title || 'BỘ SƯU TẬP DANH HIỆU'}</div>
            ${chart.trophy_sub ? `<div class="dd-sec-sub">${chart.trophy_sub}</div>` : ''}
          </div>
          <div class="dd-trophy-grid">${tilesHtml}</div>
        </div>
      `);
    }

    if (chart.banner) {
      bodyParts.push(`
        <div class="dd-race-banner" id="dd-banner-${sIdx}">
          <div class="dd-race-banner-tag">${chart.banner.tag || 'CỘT MỐC'}</div>
          <div class="dd-race-banner-txt">${chart.banner.text || ''}</div>
        </div>
      `);
    }

    if (chart.kpis && chart.kpis.length) {
      const kpisHtml = chart.kpis.map((k, kIdx) => `
        <div class="dd-kpi-tile" id="dd-kpi-${sIdx}-${kIdx}">
          <div class="dd-kpi-lbl">${k.label || ''}</div>
          <div class="dd-kpi-val">${k.value || ''}</div>
          ${k.sub ? `<div class="dd-kpi-sub">${k.sub}</div>` : ''}
        </div>
      `).join("");
      bodyParts.push(`<div class="dd-kpi-row">${kpisHtml}</div>`);
    }

    return `
      <div class="dd-chart-stage" id="dd-stage-${sIdx}">
        <div class="dd-chart-card" id="dd-card-${sIdx}">
          <div class="dd-chart-head">
            <div class="dd-chart-kicker"><span class="dd-kicker-dot"></span><span>${chart.kicker || 'THỐNG KÊ SỰ NGHIỆP'}</span></div>
            <div class="dd-chart-title">${chart.title || ''}</div>
            ${legHtml ? `<div class="dd-chart-legend">${legHtml}</div>` : ''}
          </div>
          <div class="dd-chart-body">
            ${bodyParts.join("")}
          </div>
          <div class="dd-chart-foot">
            <span>${chart.foot_left || 'Nguồn: VnExpress Thể thao'}</span>
            <span>${chart.foot_right || 'Cột mốc: Ở tuổi 19'}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderOpeningHookHtml(hook, sIdx) {
    if (!hook) return "";
    const pills = hook.pills || [];
    const pillsHtml = pills.map((p, pIdx) => `
      <div class="dd-hook-pill ${p.style || ''}" id="dd-hook-pill-${sIdx}-${pIdx}">${p.text || ''}</div>
    `).join("");
    const oppPct = Number(hook.opp_val || 0);
    return `
      <div class="dd-hook-layer" id="dd-hook-layer-${sIdx}">
        <div class="dd-hook-flash" id="dd-hook-flash-${sIdx}"></div>
        <div class="dd-hook-scan" id="dd-hook-scan-${sIdx}"></div>
        <div class="dd-hook-ring" id="dd-hook-ring-1-${sIdx}"></div>
        <div class="dd-hook-ring ring-2" id="dd-hook-ring-2-${sIdx}"></div>
        <div class="dd-hook-hud" id="dd-hook-hud-${sIdx}">
          <span class="dd-hook-corner tl"></span>
          <span class="dd-hook-corner tr"></span>
          <span class="dd-hook-corner bl"></span>
          <span class="dd-hook-corner br"></span>
          <div class="dd-hook-top">
            <div class="dd-hook-kicker"><span class="dd-hook-dot"></span><span>${hook.kicker || 'SIÊU KỶ LỤC'}</span></div>
            ${hook.vs_badge ? `<div class="dd-hook-vs">${hook.vs_badge}</div>` : ''}
          </div>
          <div class="dd-hook-main">
            <div class="dd-hook-num"><span id="dd-hook-num-${sIdx}">0</span><span class="unit">${hook.stat_unit || '%'}</span></div>
            <div class="dd-hook-meta">
              <div class="dd-hook-label">${hook.stat_label || ''}</div>
              ${hook.stat_sub ? `<div class="dd-hook-sub">${hook.stat_sub}</div>` : ''}
            </div>
          </div>
          <div class="dd-hook-bar-track">
            <div class="dd-hook-bar-fill" id="dd-hook-bar-${sIdx}"></div>
            ${oppPct > 0 ? `<div class="dd-hook-bar-mark" style="left:${oppPct}%"></div>` : ''}
          </div>
          ${pillsHtml ? `<div class="dd-hook-pills">${pillsHtml}</div>` : ''}
        </div>
      </div>
    `;
  }

  // 3. Render DOM cho Sân khấu ảnh & Đồ thị dữ liệu (căn lề chuẩn, lia ảnh ngang mượt mà)
  const root = document.getElementById("scenes-root");
  root.innerHTML = "";

  sentences.forEach((sent, sIdx) => {
    const stage = document.createElement("div");
    stage.className = `sentence-stage stage-${sIdx}`;
    stage.id = `sent-stage-${sIdx}`;

    const imgs = sent.images || [];
    let imgsHtml = "";
    imgs.forEach((im, imIdx) => {
      const cls = im.is_portrait ? "pan-img portrait-img" : "pan-img";
      const imgSrc = im.src || im.file_url || im.path || "";
      const posCss = im.is_portrait
        ? `object-position:${im.obj_pos || '50% 18%'};transform-origin:${im.origin || im.obj_pos || '50% 16%'};`
        : "";
      imgsHtml += `<img class="${cls}" id="img-${sIdx}-${imIdx}" src="${imgSrc}" style="${imIdx > 0 ? 'opacity:0;' : ''}${posCss}">`;
    });

    const wrapCls = sent.chart ? "pan-photo-wrapper has-chart-backdrop" : "pan-photo-wrapper";
    const chartHtml = sent.chart ? renderChartStageHtml(sent.chart, sIdx) : "";
    const hookHtml = sent.hook ? renderOpeningHookHtml(sent.hook, sIdx) : "";

    stage.innerHTML = `
      <div class="${wrapCls}" id="pan-wrap-${sIdx}">
        ${imgsHtml}
      </div>
      ${hookHtml}
      ${chartHtml}
    `;
    root.appendChild(stage);
  });

  // 4. ANIMATION TIMELINE (GSAP)
  const tl = gsap.timeline({ paused: true });
  window.mainTl = tl;

  sentences.forEach((sent, sIdx) => {
    const stageId = `#sent-stage-${sIdx}`;
    const sStart = sent.start;
    const sEnd = sent.end;
    const sDur = sent.duration || (sEnd - sStart);
    const imgs = sent.images || [];
    const sentTitle = (sent.item_title || data.title || "").trim();
    const sentGroup = (sent.item_group || data.group || "TIN THỂ THAO").trim();
    const sentNewsSrc = (sent.news_source || data.news_source || data.source || "").trim();
    const isTitleSent = (sent.is_title === true) || (sIdx === 0 && sent.is_title !== false);

    // Cập nhật Header Category Pill, Nguồn tin góc trái và Tiêu đề động theo từng câu/tin
    tl.call(() => {
      if (catPillEl && sentGroup) {
        catPillEl.textContent = sentGroup;
      }
      if (newsSourceEl) {
        if (sentNewsSrc) {
          let cleanSrc = sentNewsSrc.replace(/^(nguồn|ảnh|nguon|anh)\s*:\s*/i, "").trim();
          newsSourceEl.textContent = `📰 NGUỒN: ${cleanSrc.toUpperCase()}`;
          newsSourceEl.style.display = "block";
        }
      }
      if (isTitleSent) {
        heroTitleEl.innerHTML = renderHeroTitleHTML(sentTitle, sent.keywords);
        if (heroTitleContainerEl) {
          heroTitleContainerEl.style.display = "block";
          gsap.set(heroTitleContainerEl, { autoAlpha: 1 });
        }
        if (fixedHeadlineContainerEl) {
          fixedHeadlineContainerEl.style.display = "none";
        }
      } else {
        if (heroTitleContainerEl) {
          gsap.set(heroTitleContainerEl, { autoAlpha: 0 });
          heroTitleContainerEl.style.display = "none";
        }
        if (fixedHeadlineEl && sentTitle) {
          fixedHeadlineEl.textContent = sentTitle;
        }
        if (fixedHeadlineContainerEl) {
          fixedHeadlineContainerEl.style.display = "block";
          gsap.set(fixedHeadlineContainerEl, { autoAlpha: 1, opacity: 1, y: 0 });
        }
        if (fixedHeadlineEl) {
          fitHeadlineDOM(fixedHeadlineEl, 3, 36, 42);
        }
      }
    }, null, sStart);

    // Xuất hiện mềm mại của stage câu
    if (sIdx === 0) {
      tl.set(stageId, { autoAlpha: 1 }, 0);
    } else {
      tl.fromTo(stageId, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45, ease: "power1.out" }, sStart);
    }
    // Fade out stage khi stage tiếp theo đã xuất hiện (tránh khoảng đen)
    if (sIdx < sentences.length - 1) {
      tl.to(stageId, { autoAlpha: 0, duration: 0.35, ease: "power1.in" }, sEnd);
    }

    // Hiệu ứng Opening Hook kích thích 3 giây đầu (khi sent.hook được cấu hình)
    if (sent.hook) {
      const hk = sent.hook;
      const panWrapEl = document.querySelector(`#pan-wrap-${sIdx}`);
      const flashEl = document.querySelector(`#dd-hook-flash-${sIdx}`);
      const scanEl = document.querySelector(`#dd-hook-scan-${sIdx}`);
      const ring1El = document.querySelector(`#dd-hook-ring-1-${sIdx}`);
      const ring2El = document.querySelector(`#dd-hook-ring-2-${sIdx}`);
      const hudEl = document.querySelector(`#dd-hook-hud-${sIdx}`);
      const numEl = document.querySelector(`#dd-hook-num-${sIdx}`);
      const barEl = document.querySelector(`#dd-hook-bar-${sIdx}`);

      // 1. Crash-Zoom & Rung giảm chấn khung hình mở màn
      if (panWrapEl) {
        tl.fromTo(panWrapEl, { scale: 1.24 }, { scale: 1.0, duration: 0.42, ease: "expo.out" }, sStart);
      }
      tl.fromTo(stageId, { x: -12, y: 10 }, { x: 10, y: -8, duration: 0.06, ease: "none" }, sStart)
        .to(stageId, { x: -7, y: 5, duration: 0.06, ease: "none" }, sStart + 0.06)
        .to(stageId, { x: 4, y: -3, duration: 0.06, ease: "none" }, sStart + 0.12)
        .to(stageId, { x: 0, y: 0, duration: 0.08, ease: "power2.out" }, sStart + 0.18);

      // 2. Hero Title Box bật Slam
      if (heroTitleContainerEl) {
        tl.fromTo(heroTitleContainerEl, { y: -26, scale: 1.09, opacity: 0.2 }, { y: 0, scale: 1.0, opacity: 1, duration: 0.34, ease: "back.out(1.45)" }, sStart);
      }

      // 3. Nháy Flash & Tia quét Laser Scanline
      if (flashEl) {
        tl.fromTo(flashEl, { opacity: 0.72 }, { opacity: 0, duration: 0.24, ease: "power2.out" }, sStart);
      }
      if (scanEl) {
        tl.fromTo(scanEl, { y: 0, opacity: 0.92 }, { y: 1850, opacity: 0, duration: 0.75, ease: "power1.inOut" }, sStart + 0.04);
      }

      // 4. Vòng Shockwave 1 (lúc mở) & 2 (lúc số chạm đỉnh)
      if (ring1El) {
        tl.fromTo(ring1El, { scale: 0.22, opacity: 0.95 }, { scale: 2.35, opacity: 0, duration: 0.62, ease: "power3.out" }, sStart + 0.03);
      }
      if (ring2El) {
        tl.fromTo(ring2El, { scale: 0.28, opacity: 0.92 }, { scale: 2.15, opacity: 0, duration: 0.56, ease: "power3.out" }, sStart + 0.76);
      }

      // 5. Center Hook HUD Score-Slam & Con số 0 -> 99% siêu tốc
      if (hudEl) {
        tl.fromTo(hudEl, { scale: 1.38, y: 42, opacity: 0 }, { scale: 1.0, y: 0, opacity: 1, duration: 0.34, ease: "back.out(1.6)" }, sStart + 0.06);
      }
      const statTarget = Number(hk.stat_val || 99);
      const countDur = Number(hk.count_dur || 0.70);
      if (numEl) {
        const counterObj = { v: 0 };
        tl.to(counterObj, {
          v: statTarget,
          duration: countDur,
          ease: "power2.out",
          onUpdate: () => { numEl.textContent = Math.round(counterObj.v); }
        }, sStart + 0.08);
        tl.to(numEl.parentElement, { scale: 1.14, duration: 0.12, ease: "power2.out" }, sStart + 0.08 + countDur)
          .to(numEl.parentElement, { scale: 1.0, duration: 0.22, ease: "back.out(1.6)" }, sStart + 0.20 + countDur);
      }
      if (barEl) {
        tl.fromTo(barEl, { width: "0%" }, { width: `${Math.min(100, statTarget)}%`, duration: countDur, ease: "power2.out" }, sStart + 0.08);
      }

      // 6. Các Tactical Pills bật nối nhịp theo vết cắt ảnh
      (hk.pills || []).forEach((p, pIdx) => {
        const pEl = document.querySelector(`#dd-hook-pill-${sIdx}-${pIdx}`);
        const pAt = sStart + Number(p.delay || (1.35 + pIdx * 0.65));
        if (pEl) {
          tl.fromTo(pEl, { opacity: 0, y: 20, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(1.7)" }, pAt);
        }
      });

      // 7. Thu gọn Hook HUD trước khi sang câu 1 để lộ chân dung/huy chương
      const exitAt = sStart + Number(hk.exit_at || Math.max(sDur - 0.85, 3.1));
      if (hudEl && exitAt < sEnd) {
        tl.to(hudEl, { opacity: 0, y: 24, scale: 0.96, duration: 0.36, ease: "power2.in" }, exitAt);
      }
    }

    // Hoạt họa đồ thị dữ liệu Cyber-Stadium (nếu câu có sent.chart)
    if (sent.chart) {
      if (photoCreditEl) {
        const chCred = sent.chart.credit || sent.credit || "VNEXPRESS / ĐIỂM ĐỌC DATA";
        const cleanCh = chCred.replace(/^(đồ họa|do hoa|ảnh|anh|nguồn|nguon)\s*:\s*/i, "").trim();
        tl.set(photoCreditEl, {
          textContent: `📊 ĐỒ HỌA: ${cleanCh.toUpperCase()}`,
          display: "block"
        }, sStart);
      }

      const cardEl = document.querySelector(`#dd-card-${sIdx}`);
      if (cardEl) {
        tl.fromTo(cardEl, { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, sStart);
      }

      if (sent.chart.type === "duel_stack" && sent.chart.hero) {
        const h = sent.chart.hero;
        const heroDur = Math.min(1.5, sDur * 0.42);
        const hLEl = document.querySelector(`#dd-hero-l-${sIdx}`);
        const hREl = document.querySelector(`#dd-hero-r-${sIdx}`);
        if (hLEl) {
          const pL = { v: 0 };
          tl.to(pL, { v: h.left_val || 0, duration: heroDur, ease: "power2.out", onUpdate: () => { hLEl.textContent = Math.round(pL.v); } }, sStart + 0.22);
        }
        if (hREl) {
          const pR = { v: 0 };
          tl.to(pR, { v: h.right_val || 0, duration: heroDur, ease: "power2.out", onUpdate: () => { hREl.textContent = Math.round(pR.v); } }, sStart + 0.22);
        }
      }

      const secs = sent.chart.sections || [];
      const secStep = secs.length > 1 ? Math.min(1.05, (sDur * 0.36) / secs.length) : 0;
      const barDur = Math.min(1.45, sDur * 0.36);

      secs.forEach((sec, secIdx) => {
        const secStart = sStart + 0.22 + secIdx * secStep;
        (sec.rows || []).forEach((r, rIdx) => {
          const barEl = document.querySelector(`#dd-bar-${sIdx}-${secIdx}-${rIdx}`);
          const valEl = document.querySelector(`#dd-val-${sIdx}-${secIdx}-${rIdx}`);
          const rowAt = secStart + rIdx * 0.13;
          if (barEl) {
            const pct = barEl.getAttribute("data-target-pct") || "0";
            tl.fromTo(barEl, { width: "0%" }, { width: `${pct}%`, duration: barDur, ease: "power2.out" }, rowAt);
          }
          if (valEl) {
            const targetVal = Number(valEl.getAttribute("data-target-val") || 0);
            const unit = valEl.getAttribute("data-unit") || "";
            const p = { v: 0 };
            tl.to(p, {
              v: targetVal,
              duration: barDur,
              ease: "power2.out",
              onUpdate: () => { valEl.textContent = Math.round(p.v) + unit; }
            }, rowAt);
          }
        });
      });

      const trophies = sent.chart.trophies || [];
      if (trophies.length) {
        const tileBase = sStart + Math.min(1.15, sDur * 0.26);
        trophies.forEach((t, tIdx) => {
          const tEl = document.querySelector(`#dd-trophy-${sIdx}-${tIdx}`);
          if (tEl) {
            tl.fromTo(tEl, { opacity: 0, y: 18, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(1.4)" }, tileBase + tIdx * 0.15);
          }
        });
      }

      const bannerEl = document.querySelector(`#dd-banner-${sIdx}`);
      if (bannerEl) {
        tl.fromTo(bannerEl, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, sStart + Math.min(0.85, sDur * 0.22));
      }

      const kpis = sent.chart.kpis || [];
      if (kpis.length) {
        const kpiBase = sStart + Math.min(1.75, sDur * 0.42);
        kpis.forEach((k, kIdx) => {
          const kEl = document.querySelector(`#dd-kpi-${sIdx}-${kIdx}`);
          if (kEl) {
            tl.fromTo(kEl, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, kpiBase + kIdx * 0.14);
          }
        });
      }
    }

    if (!imgs.length) return;

    const numImgs = imgs.length;
    const sliceDur = sDur / numImgs;

    imgs.forEach((im, imIdx) => {
      const imgEl = document.querySelector(`#img-${sIdx}-${imIdx}`);
      if (!imgEl) return;

      const imStart = sStart + imIdx * sliceDur;
      // Kéo dài chuyển động thêm 0.5s để ảnh luôn di chuyển mượt mà tới khi ảnh/câu sau thế chỗ (không bao giờ bị đứng)
      const motionDur = sliceDur + (imIdx === numImgs - 1 ? 0.6 : 0.4);

      // Cập nhật nguồn ảnh góc dưới bên phải theo từng ảnh (giữ nguyên nhãn Đồ họa nếu câu dùng DataViz)
      if (!sent.chart && photoCreditEl) {
        const imCredit = im.credit || sent.credit || data.credit || "";
        if (imCredit && imCredit.trim()) {
          let cleanCred = imCredit.replace(/^(ảnh|anh|nguồn|nguon)\s*:\s*/i, "").trim();
          tl.set(photoCreditEl, {
            textContent: `📷 ẢNH: ${cleanCred.toUpperCase()}`,
            display: "block"
          }, imStart);
        }
      }

      if (im.is_portrait) {
        // Ảnh đứng: zoom chậm thanh lịch quanh điểm neo đầu nhân vật
        tl.fromTo(
          imgEl,
          { scale: 1.02 },
          { scale: 1.08, duration: motionDur, ease: "none" },
          imStart
        );
      } else {
        // Ảnh ngang: LIA TOÀN CẢNH (ẢNH CHẠY) MƯỢT MÀ
        const sx = (im.start_x !== undefined) ? im.start_x : 0;
        const ex = (im.end_x !== undefined) ? im.end_x : -(im.pan_shift || 800);
        tl.fromTo(
          imgEl,
          { x: sx, y: 0, scale: 1.02 },
          { x: ex, y: 0, scale: 1.02, duration: motionDur, ease: "none" },
          imStart
        );
      }

      // Chuyển ảnh mềm mại (crossfade) giữa các ảnh trong cùng 1 câu (hoặc cắt nhanh kích thích nếu hook.fast_cut)
      if (imIdx > 0) {
        if (sent.hook && sent.hook.fast_cut) {
          tl.fromTo(
            imgEl,
            { opacity: 0 },
            { opacity: 1, duration: 0.10, ease: "power2.out" },
            imStart
          );
          const flashEl = document.querySelector(`#dd-hook-flash-${sIdx}`);
          if (flashEl) {
            tl.fromTo(flashEl, { opacity: 0.45 }, { opacity: 0, duration: 0.18, ease: "power2.out" }, imStart);
          }
          const panWrapEl = document.querySelector(`#pan-wrap-${sIdx}`);
          if (panWrapEl) {
            tl.fromTo(panWrapEl, { scale: 1.12 }, { scale: 1.0, duration: 0.28, ease: "power3.out" }, imStart);
          }
        } else {
          tl.fromTo(
            imgEl,
            { opacity: 0 },
            { opacity: 1, duration: 0.55, ease: "power1.inOut" },
            imStart
          );
        }
      }
    });
  });

  // 5. KHỞI TẠO LỚP OVERLAY DÙNG CHUNG (dd_overlay.js)
  const canvas = document.getElementById("fx-canvas");
  if (window.DDOverlay) {
    window.DDOverlay.init(canvas, {
      seed: String(data.item_id || "1") + (data.title || "diemdoc_short"),
      config: fxConfig
    });

    sentences.forEach(s => {
      (s.keywords || []).forEach(kw => {
        for (let ci = 0; ci < karaokeChunks.length; ci++) {
          const c = karaokeChunks[ci];
          for (let wi = 0; wi < c.words.length; wi++) {
            const w = c.words[wi];
            if (w.word.toLowerCase().includes(kw.toLowerCase()) || kw.toLowerCase().includes(w.word.toLowerCase())) {
              window.DDOverlay.addBurst(w.start, 1080 / 2, 1920 - 120);
            }
          }
        }
      });
    });
  }

  // 6. ĐỒNG BỘ KARAOKE THEO THỜI GIAN (ĐẢM BẢO 100% LUÔN CÓ PHỤ ĐỀ HIỂN THỊ)
  const kBox = document.getElementById("karaoke-box");

  window.updateKaraoke = function(sec) {
    if (!karaokeChunks || !karaokeChunks.length) return;

    // 1. Tìm active chunk chính xác
    let activeChunk = null;
    for (let i = 0; i < karaokeChunks.length; i++) {
      const c = karaokeChunks[i];
      if (sec >= (c.start - 0.08) && sec <= (c.end + 0.2)) {
        activeChunk = c;
        break;
      }
    }

    // 2. Nếu đang ở khoảng lặng ngắn giữa 2 chunk hoặc đổi câu, lấy chunk gần nhất trước đó
    if (!activeChunk) {
      for (let i = karaokeChunks.length - 1; i >= 0; i--) {
        if (karaokeChunks[i].start <= sec) {
          activeChunk = karaokeChunks[i];
          break;
        }
      }
    }

    // Nếu vẫn chưa có (ở giây 0), lấy chunk đầu tiên
    if (!activeChunk) {
      activeChunk = karaokeChunks[0];
    }

    if (!activeChunk) return;

    // Tìm câu hiện tại để highlight keyword
    let curSent = sentences.find(s => sec >= s.start && sec <= s.end);
    const keywords = (curSent && curSent.keywords) || [];

    kBox.innerHTML = activeChunk.words.map(w => {
      let cls = "k-word";
      const isKw = keywords.some(k => k.toLowerCase().includes(w.word.toLowerCase()));
      if (isKw) cls += " is-keyword";

      if (sec >= (w.start - 0.04) && sec <= (w.end + 0.06)) {
        cls += " active";
      } else if (sec > w.end) {
        cls += " spoken";
      }
      return `<span class="${cls}">${w.word}</span>`;
    }).join("");
  };

  // 7. MÓC NỐI ĐỒNG HỒ ẢO (VIRTUAL CLOCK HOOK)
  const globalOffsetSec = data.global_offset_sec || 0.0;
  window.updateAudioTime = function(sec) {
    if (window.mainTl) {
      window.mainTl.time(sec);
    }
    window.updateKaraoke(sec);

    if (window.DDOverlay) {
      window.DDOverlay.update(sec, globalOffsetSec);
    }
  };

  if (window.__vt) {
    const origAdv = window.__vt.advanceTo;
    window.__vt.advanceTo = function(ms) {
      const vnow = origAdv.call(window.__vt, ms);
      window.updateAudioTime(vnow / 1000.0);
      return vnow;
    };
  }

  // Khởi động tại giây 0
  fitHeadlineDOM(fixedHeadlineEl, 3, 38, 44);
  window.updateAudioTime(0.0);
})();
</script>
</body>
