<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<!--
  THUMBNAIL 9:16 CHUẨN THỐNG NHẤT — Kênh Điểm Đọc (Cyber-Stadium Electric Cyan)
  Dùng chung cho:
    - Loại 3: Video ngắn tin tức hằng ngày / ý tưởng riêng (outputs/Orther/DD.MM.YYYY/shorts/)
    - Shorts trích xuất từ Loại 1 (Focus Short 2-5 tin & Digest Short 25 tin)
    - Shorts trích xuất từ Loại 2 (Video chuyên đề / nhân vật / thống kê)
-->
<style>
  @font-face { font-family:'Anton'; src:url('__ASSETS__/fonts/Anton/Anton-Regular.ttf'); font-weight:400; font-display:block; }
  @font-face { font-family:'Oswald'; src:url('__ASSETS__/fonts/Oswald/static/Oswald-Bold.ttf'); font-weight:700; font-display:block; }
  @font-face { font-family:'Oswald'; src:url('__ASSETS__/fonts/Oswald/static/Oswald-SemiBold.ttf'); font-weight:600; font-display:block; }
  @font-face { font-family:'Montserrat'; src:url('__ASSETS__/fonts/Montserrat/static/Montserrat-Bold.ttf'); font-weight:700; font-display:block; }
  @font-face { font-family:'PlexMono'; src:url('__ASSETS__/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf'); font-weight:700; font-display:block; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #060911;
    font-family: 'Oswald', sans-serif;
    color: #FFFFFF;
    position: relative;
  }

  /* ── NỬA TRÊN: ẢNH HERO SẮC NÉT (58% CHIỀU CAO, HEAD-SAFE) ── */
  .bg-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 60%;
    overflow: hidden;
    background: #060911;
  }

  .bg-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: __THUMB_OBJ_POS__;
    filter: __THUMB_FILTER__;
  }

  .bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      rgba(6,9,17,0.45) 0%,
      rgba(6,9,17,0.05) 25%,
      rgba(6,9,17,0.75) 50%,
      #060911 59%,
      #060911 100%
    );
    z-index: 2;
  }

  .glow-cyan {
    position: absolute;
    width: 860px;
    height: 860px;
    background: radial-gradient(circle, rgba(0,229,255,0.20) 0%, transparent 70%);
    top: 54%;
    left: 50%;
    transform: translate(-50%, -30%);
    filter: blur(90px);
    pointer-events: none;
    z-index: 3;
  }

  /* Viền khung Cyber-Stadium đồng bộ với bản 16:9 */
  .border-frame {
    position: absolute;
    inset: 20px;
    border: 1.5px solid rgba(0, 229, 255, 0.22);
    border-radius: 16px;
    pointer-events: none;
    z-index: 20;
  }

  /* ── HEADER GÓC TRÊN ── */
  .header-badge {
    position: absolute;
    top: 64px;
    left: 56px;
    right: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .logo-box {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(10, 14, 23, 0.92);
    padding: 12px 26px 12px 14px;
    border-radius: 999px;
    border: 2px solid rgba(0, 229, 255, 0.65);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.75), 0 0 18px rgba(0, 229, 255, 0.28);
    backdrop-filter: blur(10px);
  }

  .logo-box img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid #00E5FF;
  }

  .logo-text {
    font-family: 'Oswald', sans-serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #FFFFFF;
    text-transform: uppercase;
  }

  .logo-text .sub {
    color: #00E5FF;
    margin-left: 6px;
  }

  .kicker-tag {
    background: rgba(255, 194, 77, 0.16);
    border: 2px solid rgba(255, 194, 77, 0.75);
    padding: 12px 24px;
    border-radius: 999px;
    font-family: 'PlexMono', monospace;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #FFC24D;
    text-transform: uppercase;
    box-shadow: 0 4px 18px rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
  }

  /* ── SÂN KHẤU TYPOGRAPHY PHÍA DƯỚI ── */
  .stage-bottom {
    position: absolute;
    bottom: 76px;
    left: 60px;
    right: 60px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 10;
  }

  .kicker-line {
    font-family: 'PlexMono', monospace;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 3.5px;
    color: #00E5FF;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .kicker-line::before {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    background: #00E5FF;
    border-radius: 3px;
    box-shadow: 0 0 12px #00E5FF;
  }

  .hero-title {
    font-family: 'Anton', sans-serif;
    font-size: __THUMB_HERO_SIZE__px;
    font-weight: 400;
    line-height: 0.98;
    text-transform: uppercase;
    color: #FFFFFF;
    text-shadow: 0 6px 24px rgba(0,0,0,0.95), 0 0 30px rgba(0, 229, 255, 0.35);
    letter-spacing: 1px;
  }

  .hero-title .hl-cyan, .hero-title .highlight-cyan {
    color: #00E5FF;
    text-shadow: 0 4px 20px rgba(0,0,0,0.95), 0 0 28px rgba(0,229,255,0.45);
  }

  .hero-title .hl-yellow, .hero-title .highlight, .hero-title .accent {
    color: #FFC24D;
    text-shadow: 0 4px 20px rgba(0,0,0,0.95);
  }

  .hero-title .hl-red, .hero-title .highlight-red {
    color: #FF3B3B;
    text-shadow: 0 4px 20px rgba(0,0,0,0.95);
  }

  .hero-title .hl-white, .hero-title .highlight-white {
    color: #FFFFFF;
  }

  .rule-bar {
    height: 7px;
    width: 200px;
    background: linear-gradient(90deg, #00E5FF 0%, #FFC24D 100%);
    border-radius: 4px;
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.5);
  }

  .sub-title {
    font-family: 'Oswald', sans-serif;
    font-size: 36px;
    font-weight: 700;
    line-height: 1.25;
    color: #E2E8F0;
    background: rgba(15, 23, 42, 0.92);
    padding: 18px 26px;
    border-radius: 16px;
    border-left: 8px solid #00E5FF;
    backdrop-filter: blur(10px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .footer-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
  }

  .tag-row {
    display: flex;
    gap: 16px;
  }

  .stat-pill {
    background: rgba(15, 23, 42, 0.95);
    border: 1.5px solid rgba(0, 229, 255, 0.4);
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'PlexMono', monospace;
    font-size: 21px;
    font-weight: 700;
    color: #00E5FF;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat-pill.secondary {
    color: #FFC24D;
    border-color: rgba(255, 194, 77, 0.45);
  }
</style>
</head>
<body>
  <div class="border-frame"></div>

  <div class="bg-img">
    <img src="__THUMB_IMAGE__" alt="Hero">
  </div>
  <div class="bg-overlay"></div>
  <div class="glow-cyan"></div>

  <div class="header-badge">
    <div class="logo-box">
      <img src="__LOGO_URL__" alt="Logo" onerror="this.style.display='none'">
      <div class="logo-text">ĐIỂM ĐỌC<span class="sub">THỂ THAO</span></div>
    </div>
    <div class="kicker-tag">__THUMB_BADGE__</div>
  </div>

  <div class="stage-bottom">
    <div class="kicker-line">__THUMB_KICKER__</div>
    <div class="hero-title">__THUMB_HERO__</div>
    <div class="rule-bar"></div>
    <div class="sub-title">__THUMB_SUBTITLE__</div>
    <div class="footer-meta">
      <div class="tag-row">
        <div class="stat-pill">__THUMB_TAG_A__</div>
        <div class="stat-pill secondary">__THUMB_TAG_B__</div>
      </div>
    </div>
  </div>
</body>
</html>
