<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>Điểm Đọc — Cinematic Neon Dark (Long)</title>

<!-- ══════════════════════════════════════════════════════════════════════
     BRAND: Cinematic Neon Dark  |  format: long 16:9 (1920x1080)
     Template chỉ khai báo bản sắc thị giác; cấu trúc nằm ở _base.css.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  @font-face { font-family:'Anton'; src:url('__ASSETS__/fonts/Anton/Anton-Regular.ttf'); font-weight:400; font-display:block; }
  @font-face { font-family:'Oswald'; src:url('__ASSETS__/fonts/Oswald/static/Oswald-Bold.ttf'); font-weight:700; font-display:block; }
  @font-face { font-family:'Oswald'; src:url('__ASSETS__/fonts/Oswald/static/Oswald-SemiBold.ttf'); font-weight:600; font-display:block; }
  @font-face { font-family:'Oswald'; src:url('__ASSETS__/fonts/Oswald/static/Oswald-Medium.ttf'); font-weight:500; font-display:block; }
  @font-face { font-family:'Montserrat'; src:url('__ASSETS__/fonts/Montserrat/static/Montserrat-Bold.ttf'); font-weight:700; font-display:block; }
  @font-face { font-family:'Montserrat'; src:url('__ASSETS__/fonts/Montserrat/static/Montserrat-SemiBold.ttf'); font-weight:600; font-display:block; }
  @font-face { font-family:'Montserrat'; src:url('__ASSETS__/fonts/Montserrat/static/Montserrat-Medium.ttf'); font-weight:500; font-display:block; }
  @font-face { font-family:'PlexMono'; src:url('__ASSETS__/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf'); font-weight:700; font-display:block; }
  @font-face { font-family:'PlexMono'; src:url('__ASSETS__/fonts/IBM_Plex_Mono/IBMPlexMono-Medium.ttf'); font-weight:500; font-display:block; }

  :root {
    --vw: 1920px; --vh: 1080px;

    --bg-base: #05070C;
    --bg-alt:  #0A0E17;

    --ink-strong:  #F3F6FF;
    --ink-charcoal:#D6DDF0;
    --ink-muted:   #94A0BE;
    --ink-subtle:  #5E6B8C;

    --surface-card:   linear-gradient(158deg, rgba(20,28,46,0.72), rgba(9,13,22,0.66));
    --surface-sunken: linear-gradient(160deg, rgba(20,28,46,0.60), rgba(9,13,22,0.55));
    --chip-bg:        rgba(5,7,12,0.78);

    --border-card: 1px solid rgba(148,160,190,0.18);
    --border-soft: 1px solid rgba(148,160,190,0.14);

    --shadow-card: 0 18px 48px rgba(0,0,0,0.45);

    --accent-0: #FFC24D; --accent-0-soft: rgba(255,194,77,0.16); --accent-0-edge: rgba(255,194,77,0.42);
    --accent-1: #28E0D0; --accent-1-soft: rgba(40,224,208,0.15); --accent-1-edge: rgba(40,224,208,0.42);
    --accent-2: #FF6B4A; --accent-2-soft: rgba(255,107,74,0.16); --accent-2-edge: rgba(255,107,74,0.42);
    --accent-3: #7CF3EA; --accent-3-soft: rgba(124,243,234,0.15); --accent-3-edge: rgba(124,243,234,0.42);

    --accent: var(--accent-0);
    --accent-soft: var(--accent-0-soft);
    --accent-edge: var(--accent-0-edge);
    --accent-ink: #0A0E17;

    --accent-soft-solid: rgba(255,194,77,0.34);
    --accent2-soft-solid: rgba(40,224,208,0.30);

    --font-hero:    'Anton';
    --font-heading: 'Oswald';
    --font-body:    'Montserrat';
    --font-mono:    'PlexMono';

    --ease: cubic-bezier(.22,1,.36,1);
    --radius-lg: 18px; --radius-md: 16px;
    --grid-gap: 16px;

    /* bố cục ngang */
    --safe: 56px;
    --header-top: 26px; --header-h: 78px; --header-radius: 16px;
    --header-display: flex; --header-pad: 0 26px 0 20px;
    --header-bg: linear-gradient(90deg, rgba(255,194,77,0.07), rgba(10,14,23,0.55) 30%, rgba(10,14,23,0.55) 70%, rgba(40,224,208,0.07));
    --header-border: 1px solid rgba(148,160,190,0.18);
    --header-shadow: 0 10px 40px rgba(0,0,0,0.5);
    --header-blur: blur(6px);
    --logo-h: 44px; --brand-size: 23px; --brand-track: 4px;
    --stage-top: 122px; --stage-bottom: 132px;
    --sub-bottom: 44px; --sub-max: 1660px; --sub-size: 28px;

    --grid-opacity: 0.42;
    --grid-image:
      radial-gradient(rgba(255,194,77,0.16) 1.4px, transparent 1.4px),
      linear-gradient(rgba(148,160,190,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,160,190,0.05) 1px, transparent 1px);
    --grid-size: 38px 38px, 152px 152px, 152px 152px;

    --banner-bg: linear-gradient(92deg, rgba(255,194,77,0.14), rgba(14,20,34,0.70) 40%, rgba(40,224,208,0.10));
    --banner-size: 30px;
    --giant-size: 112px;
    --number-gradient: linear-gradient(180deg, #FFFFFF, var(--accent) 82%);
    --number-fill: transparent;
    --kinetic-size: 104px;

    --sub-bg: rgba(5,7,12,0.72);
    --sub-ink: #B9C2DA;
    --sub-active: #FFFFFF;
    --sub-number: #FFC24D;

    --card-pad: 22px 26px;
    --card-topline: .85;
    --vignette-display: block;
    --vignette-shadow: inset 0 0 260px 60px rgba(0,0,0,0.82), inset 0 0 90px 10px rgba(0,0,0,0.55);
    --blob-display: block;
    --portrait-display: block;
    --portrait-w: 452px;
  }

  body {
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(255,194,77,0.10), transparent 60%),
      radial-gradient(1000px 700px at 8% 108%, rgba(40,224,208,0.10), transparent 58%),
      linear-gradient(160deg, #0A0E17 0%, #05070C 55%, #03050A 100%);
  }
  #bg-grid { mask-image: radial-gradient(circle at 50% 40%, #000 40%, transparent 82%); -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 40%, transparent 82%); }

  /* đặc trưng brand: số gradient, glow, glass */
  .gt-num, .co-num, .trio-num { filter: drop-shadow(0 6px 26px var(--accent-soft)); }
  .card { backdrop-filter: blur(4px); }
  .card.just-revealed { box-shadow: var(--shadow-card), 0 0 44px var(--accent-soft); }
  .bn-pill { box-shadow: 0 4px 20px rgba(255,194,77,0.4); }
  .card-banner { box-shadow: 0 10px 34px rgba(0,0,0,0.4); }
  .subtitle-container #subtitle-text { backdrop-filter: blur(8px); }
  .sub-word.is-number.active, .sub-word.is-number.spoken {
    font-family: var(--font-mono); font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 2px 10px; border-radius: 7px;
    border: 1px solid var(--accent-edge); text-shadow: none;
  }
</style>

<link rel="stylesheet" href="_base.css">
</head>
<body>
  <div id="bg-grid"></div>
  <div class="bg-blob" id="blob-a"></div>
  <div class="bg-blob" id="blob-b"></div>

  <header class="top-header">
    <div class="brand-left">
      <img src="images_ready/logo.png" class="brand-logo" alt=""
           onerror="this.onerror=null;this.src='__LOGO__'">
      <div class="brand-divider"></div>
      <div class="brand-name" id="channel-title">BY THE <b>NUMBERS</b></div>
    </div>
    <div id="chapter-ribbon"></div>
    <div class="scene-counter-pill" id="scene-indicator">SCENE 01 / 26</div>
  </header>

  <main id="scene-layer"></main>

  <div id="wipe"><div class="w1"></div><div class="w2"><span id="wipe-label"></span></div></div>
  <div id="slit"><div class="sl"></div><div class="sr"></div></div>
  <div id="iris"></div>
  <div id="flash"></div>
  <div id="vignette"></div>

  <script>
    // __INJECT_JSON_HERE__
    window.VIDEO_DOMAIN = { vw: 1920, vh: 1080, format: "long" };
  </script>
  <script src="_runtime.js"></script>
  <script src="_cards.js"></script>
  <script src="_director.js"></script>
</body>
</html>
