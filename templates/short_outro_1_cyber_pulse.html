<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>Điểm Đọc — Short Outro 1: Cyber Pulse & Interactive Tap</title>
<style>
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('__ASSETS__/fonts/Barlow_Condensed/BarlowCondensed-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'Barlow Condensed';
    src: url('__ASSETS__/fonts/Barlow_Condensed/BarlowCondensed-ExtraBold.ttf') format('truetype');
    font-weight: 800;
    font-display: block;
  }
  @font-face {
    font-family: 'Be Vietnam Pro';
    src: url('__ASSETS__/fonts/Be_Vietnam_Pro/BeVietnamPro-Medium.ttf') format('truetype');
    font-weight: 500;
    font-display: block;
  }
  @font-face {
    font-family: 'Be Vietnam Pro';
    src: url('__ASSETS__/fonts/Be_Vietnam_Pro/BeVietnamPro-SemiBold.ttf') format('truetype');
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: 'Be Vietnam Pro';
    src: url('__ASSETS__/fonts/Be_Vietnam_Pro/BeVietnamPro-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }
  @font-face {
    font-family: 'IBM Plex Mono';
    src: url('__ASSETS__/fonts/IBM_Plex_Mono/IBMPlexMono-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: block;
  }

  :root {
    --vw: 1080px;
    --vh: 1920px;
    --bg-dark: #060911;
    --cyan: #00E5FF;
    --sky: #38BDF8;
    --amber: #F59E0B;
    --amber-glow: #FB923C;
    --emerald: #10B981;
    --ink: #FFFFFF;
    --muted: #94A3B8;
    --font-heading: 'Barlow Condensed', sans-serif;
    --font-body: 'Be Vietnam Pro', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: var(--vw);
    height: var(--vh);
    background: var(--bg-dark);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    position: relative;
    user-select: none;
  }

  #stage {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 34%, rgba(0, 229, 255, 0.16) 0%, rgba(13, 27, 54, 0.55) 38%, #060911 82%);
    overflow: hidden;
  }

  /* Lưới sân vận động mờ phía sau */
  .stadium-arc {
    position: absolute;
    left: 50%;
    top: 34%;
    width: 1180px;
    height: 1180px;
    transform: translate(-50%, -50%);
    opacity: 0.16;
    pointer-events: none;
  }

  /* Lớp hạt phủ Cyber-Stadium */
  #fx-canvas {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  /* Khung nội dung nằm gọn trong Safe Zone Shorts (y: 260px .. 1540px, x: 70px .. 940px) */
  .safe-stage {
    position: absolute;
    left: 72px;
    right: 120px; /* Chừa mép phải cho nút UI YouTube Shorts / TikTok */
    top: 280px;
    bottom: 340px;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ── LOGO & ORBITAL RINGS ── */
  .logo-cluster {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 44px;
  }

  .logo-halo {
    position: absolute;
    inset: -26px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 229, 255, 0.35) 0%, rgba(0, 229, 255, 0) 70%);
    filter: blur(8px);
  }

  .orbital-ring {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 2px dashed rgba(0, 229, 255, 0.55);
  }

  .orbital-ring-outer {
    position: absolute;
    inset: -32px;
    border-radius: 50%;
    border: 1.5px solid rgba(56, 189, 248, 0.22);
    border-top-color: var(--cyan);
    border-bottom-color: var(--amber);
  }

  .shockwave {
    position: absolute;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    border: 4px solid var(--cyan);
    opacity: 0;
    pointer-events: none;
  }

  .brand-logo {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    object-fit: cover;
    border: 3.5px solid var(--cyan);
    box-shadow: 0 0 42px rgba(0, 229, 255, 0.45), 0 18px 40px rgba(0, 0, 0, 0.85);
    position: relative;
    z-index: 2;
  }

  /* ── TYPOGRAPHY CHÍNH ── */
  .headline-block {
    text-align: center;
    margin-bottom: 34px;
  }

  .line-mask {
    overflow: hidden;
  }

  .h-line-1 {
    font-family: var(--font-heading);
    font-size: 112px;
    font-weight: 800;
    line-height: 0.96;
    letter-spacing: 2px;
    color: var(--ink);
    text-transform: uppercase;
  }

  .h-line-2 {
    font-family: var(--font-heading);
    font-size: 120px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: 2px;
    color: var(--cyan);
    text-transform: uppercase;
    text-shadow: 0 0 32px rgba(0, 229, 255, 0.55);
  }

  /* ── ĐƯỜNG KẺ LASER CHIA TẦNG ── */
  .laser-divider {
    width: 520px;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, var(--cyan) 50%, transparent 100%);
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.7);
    margin: 10px 0 34px;
    transform-origin: center;
  }

  .cta-prompt {
    font-family: var(--font-body);
    font-size: 31px;
    font-weight: 600;
    color: #CBD5E1;
    margin-bottom: 36px;
    text-align: center;
    letter-spacing: 0.3px;
  }

  .cta-prompt span {
    color: var(--cyan);
    font-weight: 700;
  }

  /* ── 2 NÚT HÀNH ĐỘNG INTERACTIVE ── */
  .actions-stack {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    position: relative;
  }

  .action-pill {
    position: relative;
    height: 118px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 38px;
    background: rgba(13, 21, 38, 0.88);
    backdrop-filter: blur(14px);
    overflow: hidden;
  }

  .action-pill.like-pill {
    border: 2.5px solid rgba(0, 229, 255, 0.65);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 28px rgba(0, 229, 255, 0.22);
  }

  .action-pill.sub-pill {
    border: 2.5px solid rgba(245, 158, 11, 0.85);
    box-shadow: 0 14px 36px rgba(0, 0, 0, 0.65), 0 0 32px rgba(245, 158, 11, 0.25);
  }

  .action-pill.sub-pill.subscribed {
    border-color: rgba(16, 185, 129, 0.9);
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.24) 0%, rgba(0, 229, 255, 0.16) 100%);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 38px rgba(16, 185, 129, 0.38);
  }

  .pill-left {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .pill-icon-box {
    width: 68px;
    height: 68px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .like-pill .pill-icon-box {
    background: rgba(0, 229, 255, 0.15);
    border: 1.5px solid rgba(0, 229, 255, 0.45);
  }

  .sub-pill .pill-icon-box {
    background: rgba(245, 158, 11, 0.18);
    border: 1.5px solid rgba(245, 158, 11, 0.55);
  }

  .sub-pill.subscribed .pill-icon-box {
    background: rgba(16, 185, 129, 0.22);
    border-color: rgba(16, 185, 129, 0.7);
  }

  .pill-label {
    font-family: var(--font-heading);
    font-size: 58px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .like-pill .pill-label {
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.45);
  }

  .sub-pill .pill-label {
    color: #FBBF24;
    text-shadow: 0 0 18px rgba(245, 158, 11, 0.45);
  }

  .sub-pill.subscribed .pill-label {
    color: #34D399;
    text-shadow: 0 0 20px rgba(16, 185, 129, 0.55);
  }

  .pill-badge {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 999px;
    letter-spacing: 1px;
  }

  .like-pill .pill-badge {
    color: #060911;
    background: var(--cyan);
  }

  .sub-pill .pill-badge {
    color: #060911;
    background: #FBBF24;
  }

  .sub-pill.subscribed .pill-badge {
    color: #060911;
    background: #34D399;
  }

  .pill-sheen {
    position: absolute;
    top: 0;
    left: -180px;
    width: 140px;
    height: 100%;
    background: linear-gradient(105deg, transparent 0%, rgba(255, 255, 255, 0.22) 50%, transparent 100%);
    transform: skewX(-20deg);
    pointer-events: none;
  }

  .click-burst {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #34D399;
    transform: translate(-50%, -50%) scale(0.3);
    opacity: 0;
    pointer-events: none;
  }

  /* ── CON TRỎ BẤM NÚT ── */
  #cursor-pointer {
    position: absolute;
    right: 60px;
    bottom: -36px;
    width: 78px;
    height: 78px;
    z-index: 45;
    filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.75));
    pointer-events: none;
    opacity: 0;
  }

  /* ── FOOTER NHẬN DIỆN ── */
  .brand-footer {
    margin-top: 52px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .footer-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
  }
</style>
</head>
<body>
<div id="stage">
  <svg class="stadium-arc" viewBox="0 0 1000 1000" fill="none">
    <circle cx="500" cy="500" r="460" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="10 14"/>
    <circle cx="500" cy="500" r="340" stroke="#38BDF8" stroke-width="1"/>
    <line x1="40" y1="500" x2="960" y2="500" stroke="#00E5FF" stroke-width="1"/>
    <line x1="500" y1="40" x2="500" y2="960" stroke="#00E5FF" stroke-width="1"/>
  </svg>

  <canvas id="fx-canvas" width="1080" height="1920"></canvas>

  <div class="safe-stage" id="safe-stage">
    <div class="logo-cluster" id="logo-cluster">
      <div class="logo-halo" id="logo-halo"></div>
      <div class="orbital-ring" id="orbital-inner"></div>
      <div class="orbital-ring-outer" id="orbital-outer"></div>
      <div class="shockwave" id="logo-shock"></div>
      <img class="brand-logo" id="brand-logo" src="__LOGO__" alt="Điểm Đọc">
    </div>

    <div class="headline-block">
      <div class="line-mask">
        <div class="h-line-1" id="h-line-1">CẢM ƠN BẠN</div>
      </div>
      <div class="line-mask">
        <div class="h-line-2" id="h-line-2">ĐÃ XEM VIDEO!</div>
      </div>
    </div>

    <div class="laser-divider" id="laser-divider"></div>

    <div class="cta-prompt" id="cta-prompt">
      Nếu thấy hữu ích, hãy dành tặng <span>Điểm Đọc</span>:
    </div>

    <div class="actions-stack" id="actions-stack">
      <div class="action-pill like-pill" id="like-pill">
        <div class="pill-left">
          <div class="pill-icon-box">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/>
            </svg>
          </div>
          <div class="pill-label">1 LIKE</div>
        </div>
        <div class="pill-badge">THẢ TIM</div>
        <div class="pill-sheen" id="like-sheen"></div>
      </div>

      <div class="action-pill sub-pill" id="sub-pill">
        <div class="pill-left">
          <div class="pill-icon-box" id="bell-box">
            <svg id="bell-svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#FBBF24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
            </svg>
          </div>
          <div class="pill-label" id="sub-label">1 ĐĂNG KÝ</div>
        </div>
        <div class="pill-badge" id="sub-badge">BẬT CHUÔNG</div>
        <div class="pill-sheen" id="sub-sheen"></div>
        <div class="click-burst" id="click-burst"></div>
      </div>

      <svg id="cursor-pointer" viewBox="0 0 64 64" fill="none">
        <path d="M18 8L50 32L34 36L42 52L34 56L26 40L16 48V8Z" fill="#FFFFFF" stroke="#060911" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="brand-footer" id="brand-footer">
      <div class="footer-dot"></div>
      <span>ĐIỂM ĐỌC THỂ THAO • ĐỒNG HÀNH 24/7</span>
      <div class="footer-dot"></div>
    </div>
  </div>
</div>

<script src="__ASSETS__/vendor/js/gsap.min.js"></script>
<script src="__ASSETS__/overlays/dd_overlay.js"></script>
<script>
// __INJECT_JSON_HERE__
(() => {
  const DURATION = (window.VIDEO_DATA && window.VIDEO_DATA.duration) || 6.50;
  const canvas = document.getElementById("fx-canvas");
  if (window.DDOverlay) {
    window.DDOverlay.init(canvas, {
      seed: "short_outro_1_cyber_pulse",
      config: {
        sparkles: { count: 28, speed: 1.15, size_range: [5, 11] },
        embers: { count: 22, speed_y: -26, size_range: [6, 13] },
        light_sweep: { enabled: true },
        grid_lines: { enabled: true }
      }
    });
    window.DDOverlay.addBurst(0.15, 540, 560);
    window.DDOverlay.addBurst(3.75, 515, 1180);
  }

  const tl = gsap.timeline({ paused: true });
  window.mainTl = tl;

  // Vòng xoay liên tục xuyên suốt 6.5s (không bao giờ dead frame)
  tl.to("#orbital-inner", { rotation: 180, duration: DURATION, ease: "none" }, 0);
  tl.to("#orbital-outer", { rotation: -240, duration: DURATION, ease: "none" }, 0);
  tl.fromTo("#safe-stage", { scale: 1.0 }, { scale: 1.028, duration: DURATION, ease: "none" }, 0);

  // Beat 1: Logo crash-in từ 1.8x (ngay từ frame 0, tránh khung trống đầu) + Shockwave
  tl.fromTo("#logo-cluster", { scale: 1.85, opacity: 0.35 }, { scale: 1.0, opacity: 1, duration: 0.40, ease: "expo.out" }, 0.0);
  tl.fromTo("#logo-shock", { scale: 0.5, opacity: 0.95 }, { scale: 2.3, opacity: 0, duration: 0.65, ease: "power3.out" }, 0.04);

  // Headline slide-up từng dòng
  tl.fromTo("#h-line-1", { y: 80, opacity: 0.2 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, 0.14);
  tl.fromTo("#h-line-2", { y: 95, opacity: 0 }, { y: 0, opacity: 1, duration: 0.40, ease: "power3.out" }, 0.32);

  // Laser divider & prompt
  tl.fromTo("#laser-divider", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.40, ease: "expo.out" }, 0.95);
  tl.fromTo("#cta-prompt", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 1.25);

  // Beat 2: 2 action pills
  tl.fromTo("#like-pill", { y: 46, scale: 0.92, opacity: 0 }, { y: 0, scale: 1.0, opacity: 1, duration: 0.38, ease: "back.out(1.4)" }, 1.65);
  tl.fromTo("#sub-pill", { y: 46, scale: 0.92, opacity: 0 }, { y: 0, scale: 1.0, opacity: 1, duration: 0.38, ease: "back.out(1.4)" }, 2.00);
  tl.fromTo("#like-sheen", { left: "-180px" }, { left: "820px", duration: 0.65, ease: "power2.inOut" }, 2.15);

  // Cursor sweeps in & taps Subscribe
  tl.fromTo("#cursor-pointer",
    { x: 180, y: 180, scale: 1.45, opacity: 0 },
    { x: -120, y: -55, scale: 1.0, opacity: 1, duration: 0.65, ease: "power3.out" },
    2.90
  );
  // Press squash
  tl.to("#cursor-pointer", { scale: 0.80, y: -44, duration: 0.08, ease: "power2.in" }, 3.62);
  tl.to("#sub-pill", { scale: 0.94, duration: 0.08, ease: "power2.in" }, 3.62);

  // State change at tap!
  const subPill = document.getElementById("sub-pill");
  const subLabel = document.getElementById("sub-label");
  const subBadge = document.getElementById("sub-badge");
  const bellSvg = document.getElementById("bell-svg");

  tl.call(() => {
    subPill.classList.add("subscribed");
    subLabel.textContent = "ĐÃ ĐĂNG KÝ";
    subBadge.textContent = "ĐÃ BẬT 🔔";
    bellSvg.setAttribute("stroke", "#34D399");
  }, null, 3.70);

  // Revert state when scrubbing backward before 3.70s
  tl.call(() => {
    if (tl.time() < 3.70) {
      subPill.classList.remove("subscribed");
      subLabel.textContent = "1 ĐĂNG KÝ";
      subBadge.textContent = "BẬT CHUÔNG";
      bellSvg.setAttribute("stroke", "#FBBF24");
    }
  }, null, 3.60);

  // Release bounce + burst + bell ring
  tl.to("#sub-pill", { scale: 1.02, duration: 0.16, ease: "back.out(2)" }, 3.70)
    .to("#sub-pill", { scale: 1.0, duration: 0.22, ease: "power2.out" }, 3.86);
  tl.to("#cursor-pointer", { scale: 1.05, opacity: 0, x: -70, y: -10, duration: 0.35, ease: "power2.in" }, 3.85);
  tl.fromTo("#click-burst", { scale: 0.35, opacity: 0.95 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power3.out" }, 3.70);

  // Bell wiggle
  tl.to("#bell-box", { rotation: 18, duration: 0.08 }, 3.72)
    .to("#bell-box", { rotation: -16, duration: 0.08 }, 3.80)
    .to("#bell-box", { rotation: 12, duration: 0.08 }, 3.88)
    .to("#bell-box", { rotation: -6, duration: 0.08 }, 3.96)
    .to("#bell-box", { rotation: 0, duration: 0.08 }, 4.04);

  // Sheen sweep across Subscribed pill + Footer reveal
  tl.fromTo("#sub-sheen", { left: "-180px" }, { left: "820px", duration: 0.70, ease: "power2.inOut" }, 4.15);
  tl.fromTo("#brand-footer", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 4.30);

  // Living halo pulse in tail
  tl.to("#logo-halo", { scale: 1.18, opacity: 0.9, duration: 0.9, ease: "sine.inOut" }, 4.6)
    .to("#logo-halo", { scale: 1.0, opacity: 0.7, duration: 0.9, ease: "sine.inOut" }, 5.5);

  window.updateAudioTime = function(sec) {
    if (sec < 3.70) {
      subPill.classList.remove("subscribed");
      subLabel.textContent = "1 ĐĂNG KÝ";
      subBadge.textContent = "BẬT CHUÔNG";
      bellSvg.setAttribute("stroke", "#FBBF24");
    } else {
      subPill.classList.add("subscribed");
      subLabel.textContent = "ĐÃ ĐĂNG KÝ";
      subBadge.textContent = "ĐÃ BẬT 🔔";
      bellSvg.setAttribute("stroke", "#34D399");
    }
    tl.time(Math.min(DURATION, Math.max(0, sec)));
    if (window.DDOverlay) window.DDOverlay.update(sec, 0.0);
  };

  if (window.__vt) {
    const origAdv = window.__vt.advanceTo;
    window.__vt.advanceTo = function(ms) {
      const vnow = origAdv.call(window.__vt, ms);
      window.updateAudioTime(vnow / 1000.0);
      return vnow;
    };
  }
  window.updateAudioTime(0.0);
})();
</script>
</body>
</html>
